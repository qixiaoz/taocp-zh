<text x="400" y="265" text-anchor="middle" font-size="22" font-family="serif">0 ≤ i &lt; N − d</text>
<text x="399" y="293" text-anchor="middle" font-size="22" font-family="serif">i &amp; p = r</text>
<path d="M550,325V235" stroke="#222" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<path d="M850,170C850,115 520,115 520,167" stroke="#222" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="872" y="133" text-anchor="middle" font-size="22" font-family="serif">q &gt; p</text>
