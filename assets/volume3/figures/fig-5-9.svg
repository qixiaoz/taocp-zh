<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="345" viewBox="0 0 1060 345" role="img" aria-labelledby="title desc"><title id="title">图9 算法D：分布计数</title><desc id="desc">D1清零，D2循环执行D3，D4累加，D5循环执行D6输出，最后终止。两循环都有j为0的出口。</desc><defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 4L1 7" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1060" height="345" fill="#fff"/>
