<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="300" viewBox="0 0 1060 300" role="img" aria-labelledby="title desc"><title id="title">图15 冒泡排序的流程图</title><desc id="desc">B1初始化BOUND，B2对j循环，B3比较交换后返回B2；B2完成时到B4，有交换回B2，无交换结束。</desc><defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 4L1 7" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="1060" height="300" fill="#fff"/>
<rect x="20" y="75" width="250" height="62" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/>
<text x="145.0" y="113.0" text-anchor="middle" font-family="serif" font-size="20">B1. 初始化BOUND</text>
<rect x="370" y="75" width="200" height="62" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/>
<text x="470.0" y="113.0" text-anchor="middle" font-family="serif" font-size="20">B2. 对j循环</text>
<rect x="710" y="75" width="330" height="62" rx="0" fill="#fff" stroke="#222" stroke-width="1.4"/>
<text x="875.0" y="113.0" text-anchor="middle" font-family="serif" font-size="20">B3. 比较/交换 Rⱼ : Rⱼ₊₁</text>
<rect x="345" y="210" width="250" height="54" rx="27" fill="#fff" stroke="#222" stroke-width="1.4"/>
<text x="470.0" y="244.0" text-anchor="middle" font-family="serif" font-size="20">B4. 是否有交换发生？</text>
<path d="M65,10V72" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M270,106H367" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M570,92H707" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="640" y="58" text-anchor="middle" font-family="serif" font-size="20">1 ≤ j &lt; BOUND</text>
<path d="M710,122H573" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M445,137V207" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="394" y="172" text-anchor="middle" font-family="serif" font-size="18">j = BOUND</text>
<path d="M500,210V140" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="523" y="174" text-anchor="middle" font-family="serif" font-size="20">是</text>
<path d="M470,264V293" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="495" y="289" text-anchor="middle" font-family="serif" font-size="20">否</text>
</svg>
