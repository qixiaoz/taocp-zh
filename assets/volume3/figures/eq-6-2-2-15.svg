<svg xmlns="http://www.w3.org/2000/svg" width="250" height="285" viewBox="0 0 250 285" role="img" aria-labelledby="title desc">
<title id="title">树成本示例</title><desc id="desc">根为内部键3，左子为键1，右子为外部方3；键1的左子为外部方0，右子为键2；键2的左右子为外部方1和2。</desc>
<rect width="250" height="285" fill="white"/>
<g stroke="#222" stroke-width="1.6" fill="none"><path d="M145 30L90 105M145 30L200 105M90 105L50 180M90 105L125 180M125 180L90 255M125 180L160 255"/></g>
<g fill="white" stroke="#222" stroke-width="1.6"><circle cx="145" cy="30" r="16"/><circle cx="90" cy="105" r="16"/><circle cx="125" cy="180" r="16"/>
<rect x="188" y="93" width="24" height="24"/><rect x="38" y="168" width="24" height="24"/><rect x="78" y="243" width="24" height="24"/><rect x="148" y="243" width="24" height="24"/></g>
<g fill="#222" font-family="serif" font-size="23" text-anchor="middle"><text x="145" y="38">3</text><text x="90" y="113">1</text><text x="125" y="188">2</text><text x="200" y="113">3</text><text x="50" y="188">0</text><text x="90" y="263">1</text><text x="160" y="263">2</text></g></svg>
