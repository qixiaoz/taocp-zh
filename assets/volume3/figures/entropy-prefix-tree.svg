<svg xmlns="http://www.w3.org/2000/svg" width="280" height="435" viewBox="0 0 280 435" role="img" aria-labelledby="title desc">
<title id="title">二进制前缀构树例</title><desc id="desc">叶0、1、2、3的路径分别为00000、00001、0001、1。内部键3在根、键2位于000、键1位于0000，路径0和00上的两个内部圆暂时无名，仅有左孩子。</desc>
<rect width="280" height="435" fill="white"/>
<g stroke="#222" stroke-width="1.6" fill="none"><path d="M180 25L150 100M180 25L240 100M150 100L120 175M120 175L90 250M90 250L60 325M90 250L150 325M60 325L30 400M60 325L90 400"/></g>
<g fill="white" stroke="#222" stroke-width="1.6"><circle cx="180" cy="25" r="15"/><circle cx="150" cy="100" r="15"/><circle cx="120" cy="175" r="15"/><circle cx="90" cy="250" r="15"/><circle cx="60" cy="325" r="15"/><rect x="228" y="88" width="24" height="24"/><rect x="138" y="313" width="24" height="24"/><rect x="18" y="388" width="24" height="24"/><rect x="78" y="388" width="24" height="24"/></g>
<g fill="#222" font-family="serif" font-size="24" text-anchor="middle"><text x="180" y="33">3</text><text x="90" y="258">2</text><text x="60" y="333">1</text><text x="240" y="108">3</text><text x="150" y="333">2</text><text x="30" y="408">0</text><text x="90" y="408">1</text></g></svg>
