<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
<title id="title">内部结点局部熵的示例树</title><desc id="desc">A的三个子结点为B、叶5、E；B的三个子结点为叶1、C、D；C仅有叶2；D有叶3和4；E有叶6至9。各叶概率为对应p_k。</desc>
<rect width="1000" height="450" fill="white"/>
<g stroke="#222" stroke-width="1.6" fill="none"><path d="M500 50L290 160M500 50L500 160M500 50L740 160M290 160L110 270M290 160L250 270M290 160L400 270M250 270L250 380M400 270L350 380M400 270L450 380M740 160L610 270M740 160L700 270M740 160L790 270M740 160L880 270"/></g>
<g stroke="#222" stroke-width="1.6" fill="white"><circle cx="500" cy="50" r="20"/><circle cx="290" cy="160" r="20"/><circle cx="250" cy="270" r="20"/><circle cx="400" cy="270" r="20"/><circle cx="740" cy="160" r="20"/>
<rect x="95" y="255" width="30" height="30"/><rect x="235" y="365" width="30" height="30"/><rect x="335" y="365" width="30" height="30"/><rect x="435" y="365" width="30" height="30"/><rect x="485" y="145" width="30" height="30"/><rect x="595" y="255" width="30" height="30"/><rect x="685" y="255" width="30" height="30"/><rect x="775" y="255" width="30" height="30"/><rect x="865" y="255" width="30" height="30"/></g>
<g fill="#222" font-family="serif" font-size="28" text-anchor="middle" font-style="italic"><text x="500" y="60">A</text><text x="290" y="170">B</text><text x="250" y="280">C</text><text x="400" y="280">D</text><text x="740" y="170">E</text></g>
<g fill="#222" font-family="serif" font-size="26" text-anchor="middle"><text x="110" y="279">1</text><text x="250" y="389">2</text><text x="350" y="389">3</text><text x="450" y="389">4</text><text x="500" y="169">5</text><text x="610" y="279">6</text><text x="700" y="279">7</text><text x="790" y="279">8</text><text x="880" y="279">9</text></g>
<g fill="#222" font-family="serif" font-size="26" text-anchor="middle" font-style="italic"><text x="110" y="318">p<tspan baseline-shift="sub" font-size="18">1</tspan></text><text x="250" y="428">p<tspan baseline-shift="sub" font-size="18">2</tspan></text><text x="350" y="428">p<tspan baseline-shift="sub" font-size="18">3</tspan></text><text x="450" y="428">p<tspan baseline-shift="sub" font-size="18">4</tspan></text><text x="500" y="208">p<tspan baseline-shift="sub" font-size="18">5</tspan></text><text x="610" y="318">p<tspan baseline-shift="sub" font-size="18">6</tspan></text><text x="700" y="318">p<tspan baseline-shift="sub" font-size="18">7</tspan></text><text x="790" y="318">p<tspan baseline-shift="sub" font-size="18">8</tspan></text><text x="880" y="318">p<tspan baseline-shift="sub" font-size="18">9</tspan></text></g></svg>
