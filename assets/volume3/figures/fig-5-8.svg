<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="220" viewBox="0 0 1050 220" role="img" aria-labelledby="title desc"><title id="title">图8 算法C：比较计数</title><desc id="desc">C1清零后进入C2，对i循环；C2进入C3，对j循环；C3进入C4比较，C4返回C3。j为0返回C2，i为1结束。</desc><defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 4L1 7" fill="none" stroke="#222" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#fff"/>
<rect x="20" y="75" width="220" height="60" fill="#fff" stroke="#222" stroke-width="1.4"/>
<rect x="310" y="75" width="180" height="60" fill="#fff" stroke="#222" stroke-width="1.4"/>
<rect x="590" y="75" width="180" height="60" fill="#fff" stroke="#222" stroke-width="1.4"/>
<rect x="880" y="60" width="150" height="90" fill="#fff" stroke="#222" stroke-width="1.4"/>
<text x="130" y="111" font-size="20" text-anchor="middle" font-family="serif">C1. COUNT清零</text>
<text x="400" y="111" font-size="20" text-anchor="middle" font-family="serif">C2. 对i循环</text>
<text x="680" y="111" font-size="20" text-anchor="middle" font-family="serif">C3. 对j循环</text>
<text x="955" y="96" font-size="20" text-anchor="middle" font-family="serif">C4. 比较</text>
<text x="955" y="128" font-size="22" text-anchor="middle" font-family="serif" font-style="italic">Kᵢ : Kⱼ</text>
