<path d="M490,88 H587" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/>
<text x="540" y="65" font-size="21" text-anchor="middle" font-family="serif" font-style="italic">N ≥ i &gt; 1</text>
<path d="M590,120 H493" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/>
