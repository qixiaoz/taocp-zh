<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="605" viewBox="0 -30 1260 605" role="img" aria-labelledby="title desc"><title id="title">图3 (e,f)的规范化</title><desc id="desc">算法N1至N7。N1零值直接组合，过大先右移；未规范化反复左移，舍入溢出返回右移；检查指数后组合或报告上溢下溢。</desc><rect x="0" y="-30" width="1260" height="605" fill="white"/><defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="black" stroke-width="1.3"/></marker></defs><g font-family="Songti SC, STSong, serif" fill="black"><g fill="none" stroke="black" stroke-width="1.5"><path d="M162.5 40 L162.5 120" marker-end="url(#arrow)"/><path d="M250 135 L550 85" marker-end="url(#arrow)"/><path d="M250 165 L420 245" marker-end="url(#arrow)"/><path d="M162.5 180 L162.5 467.5 L865 467.5" marker-end="url(#arrow)"/><path d="M715 88 L850 135" marker-end="url(#arrow)"/><path d="M720 250 L850 165" marker-end="url(#arrow)"/><path d="M590 280 L590 350" marker-end="url(#arrow)"/><path d="M535 350 L535 280" marker-end="url(#arrow)"/><path d="M932.5 120 C932.5 0 780 0 715 60" marker-end="url(#arrow)"/><path d="M932.5 180 L932.5 270" marker-end="url(#arrow)"/><path d="M935 330 L935 440" marker-end="url(#arrow)"/><path d="M1025 300 L1230 300" marker-end="url(#arrow)"/><path d="M935 495 L935 550" marker-end="url(#arrow)"/></g><g stroke="black" stroke-width="1.5" fill="white"><rect x="70" y="120" width="185" height="60" rx="30.0"/><rect x="550" y="60" width="165" height="55" rx="0"/><rect x="850" y="120" width="165" height="60" rx="0"/><rect x="420" y="220" width="300" height="60" rx="30.0"/><rect x="490" y="350" width="160" height="55" rx="0"/><rect x="845" y="270" width="180" height="60" rx="30.0"/><rect x="865" y="440" width="140" height="55" rx="0"/></g><text x="162.5" y="157.0" text-anchor="middle" font-size="21">N1. 检测 f</text><text x="632.5" y="94.5" text-anchor="middle" font-size="21">N4. 右移</text><text x="932.5" y="157.0" text-anchor="middle" font-