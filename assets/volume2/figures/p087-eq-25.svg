<svg xmlns="http://www.w3.org/2000/svg" width="620" height="250" viewBox="0 0 620 250" role="img" aria-labelledby="title desc"><title id="title">式25 向量的正交投影</title><desc id="desc">同一原点的V_i向右上，V_i prime竖直向上，V_j等于V_j prime水平向右；从V_i末端到V_i prime末端的水平虚线箭头标为负q_i V_j。</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L10 6L1 11" fill="none" stroke="#222" stroke-width="1.5"/></marker></defs><rect width="620" height="250" fill="white"/><g stroke="#222" stroke-width="1.7" fill="none" marker-end="url(#a)"><path d="M90 200L540 40"/><path d="M90 200V40"/><path d="M90 200H225"/><path d="M540 40H90" stroke-dasharray="7 6" stroke-width="1.3"/></g><g fill="#222" font-family="'Times New Roman',serif" font-size="25" font-style="italic" text-anchor="middle"><text x="340" y="142">V<tspan baseline-shift="sub" font-size="17">i</tspan></text><text x="59" y="122">V<tspan baseline-shift="super" font-size="17">′</tspan><tspan baseline-shift="sub" font-size="17">i</tspan></text><text x="160" y="236">V<tspan baseline-shift="sub" font-size="17">j</tspan> = V<tspan baseline-shift="super" font-size="17">′</tspan><tspan baseline-shift="sub" font-size="17">j</tspan></text><text x="315" y="25">−q<tspan baseline-shift="sub" font-size="17">i</tspan>V<tspan baseline-shift="sub" font-size="17">j</tspan></text></g></svg>
