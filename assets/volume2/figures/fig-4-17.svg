<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-labelledby="title desc"><title id="title">图17 用算法L进行幂级数反演</title><desc id="desc">四个步骤：L1初始化到L2输入Vn，到L3做除法，到L4输出Wn，再回到L2；L2在n大于N时向下退出。</desc><rect width="760" height="280" fill="white"/><defs><marker id="arrow17" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 4 L1 7" fill="none" stroke="#222" stroke-width="1.3"/></marker></defs><g fill="none" stroke="#222" stroke-width="1.5"><rect x="55" y="64" width="145" height="44"/><rect x="55" y="172" width="145" height="44"/><rect x="314" y="172" width="145" height="44"/><rect x="573" y="172" width="162" height="44"/><path d="M100 15 V64" marker-end="url(#arrow17)"/><path d="M100 108 V172" marker-end="url(#arrow17)"/><path d="M200 194 H314" marker-end="url(#arrow17)"/><path d="M459 194 H573" marker-end="url(#arrow17)"/><path d="M648 172 C520 70 265 72 150 172" marker-end="url(#arrow17)"/><path d="M100 216 V267" marker-end="url(#arrow17)"/></g><g fill="#222" font-family="Songti SC, SimSun, serif" font-size="23" text-anchor="middle"><text x="127.5" y="94">L1. 初始化</text><text x="127.5" y="201">L2. 输入 <tspan font-style="italic">V</tspan><tspan font-size="15" baseline-shift="sub">n</tspan></text><text x="386.5" y="201">L3. 做除法</text><text x="654" y="201">L4. 输出 <tspan font-style="italic">W</tspan><tspan font-size="15" baseline-shift="sub">n</tspan></text><text x="151" y="245" font-style="italic">n &gt; N</text></g></svg>