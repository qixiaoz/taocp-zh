<path id="a2-exit" d="M165 330V420"/>
<path id="a2-a3" d="M299 275L440 205"/>
<path id="a3-a4" d="M650 205L792 280"/>
<path id="a4-a5" d="M811 338L650 405"/>
<path id="a5-a2" d="M440 405L290 313"/>
