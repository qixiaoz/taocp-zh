<rect id="a5" x="440" y="365" width="210" height="90"/>
<rect id="a6" x="1110" y="240" width="230" height="110" rx="55"/>
<rect id="a7" x="1120" y="430" width="210" height="90"/>
</g>
<g fill="#111" font-family="Songti SC, SimSun, serif" font-size="30" text-anchor="middle">
<text x="165" y="115">A1. 初始化</text>
<text x="165" y="296">A2. <tspan font-style="italic">n</tspan> = 1吗？</text>
<text x="545" y="215">A3. 做除法</text>
<text x="905" y="283">A4. 余数</text><text x="905" y="321">是零吗？</text>
<text x="545" y="400">A5. 找到</text><text x="545" y="437">素因数</text>
<text x="1225" y="283">A6. 商</text><text x="1225" y="321">是否过小？</text>
<text x="1225" y="466">A7. <tspan font-style="italic">n</tspan> 是</text><text x="1225" y="504">素数</text>
<text x="202" y="375">是</text><text x="370" y="276">否</text>
<text x="735" y="390">是</text><text x="1064" y="278">否</text>
<text x="1265" y="222">否</text><text x="1265" y="396">是</text>
</g></svg>
