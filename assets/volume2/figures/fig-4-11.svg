<svg xmlns="http://www.w3.org/2000/svg" width="1370" height="600" viewBox="0 0 1370 600" role="img" aria-labelledby="title desc">
<title id="title">图11 简单的分解因数算法</title>
<desc id="desc">七个步骤A1到A7。A1进入A2；A2是则退出，否则A3；A3到A4；A4是则A5后返回A2，否则A6；A6是则A7后退出，否则返回A3。</desc>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1 1L11 6L1 11" fill="none" stroke="#111" stroke-width="1.4"/></marker></defs>
<rect width="1370" height="600" fill="white"/>
<g fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)">
