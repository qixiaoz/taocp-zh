<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="535" viewBox="0 0 1120 535" role="img" aria-labelledby="title desc"><title id="title">图2 浮点加法</title><desc id="desc">算法A1至A7。顺序路径从拆分到规范化；A4在指数差至少p加2时直接转A7。</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="black" stroke-width="1.3"/></marker></defs><g font-family="Songti SC, STSong, serif" fill="black"><g fill="none" stroke="black" stroke-width="1.5"><path d="M145 25 L145 90" marker-end="url(#arrow)"/><path d="M145 140 L145 195" marker-end="url(#arrow)"/><path d="M145 245 L145 300" marker-end="url(#arrow)"/><path d="M145 350 L145 405" marker-end="url(#arrow)"/><path d="M265 432.5 L365 432.5" marker-end="url(#arrow)"/><path d="M510 432.5 L620 432.5" marker-end="url(#arrow)"/><path d="M765 432.5 L875 432.5" marker-end="url(#arrow)"/><path d="M250 411 Q580 315 875 411" marker-end="url(#arrow)"/><path d="M957.5 460 L957.5 510" marker-end="url(#arrow)"/></g><g stroke="black" stroke-width="1.5" fill="white"><rect x="80" y="90" width="130" height="50" rx="0"/><rect x="25" y="195" width="240" height="50" rx="0"/><rect x="40" y="300" width="210" height="50" rx="0"/><rect x="25" y="405" width="240" height="55" rx="27.5"/><rect x="365" y="405" width="145" height="55" rx="0"/><rect x="620" y="405" width="145" height="55" rx="0"/><rect x="875" y="405" width="165" height="55" rx="0"/></g><text x="145.0" y="122.0" text-anchor="middle" font-size="21">A1. 拆分</text><text x="145.0" y="227.0" text-anchor="middle" font-size="21">A2. 假设 <tspan font-style="italic">e</tspan><tspan baseline-shift="sub" font-size="70%">u</tspan> ≥ <tspan font-style="italic">e</tspan><tspan baseline-shift="sub" font-size="70%">v</tspan></text><text x="145.0" y="332.0" text-anchor="middle" font-size="21">A3. 给 <tspan font-style="italic">e</tspan><tspan baseline-shift="sub" font-size="70%">w</tspan> 赋值</text><text x="145.0" y="439.5" text-anchor="middle" font-size="21">A4. 检测 <tspan font-style="italic">e</tspan><tspan baseline-shift="sub" font-size="70%">u</tspan> − <tspan font-style="italic">e</tspan><tspan baseline-shift="sub" font-size="70%">v</tspan></text><text x="437.5" y="439.5" text-anchor="middle" font-size="21">A5. 右移</text><text x="692.5" y="439.5" text-anchor="middle" font-size="21">A6. 相加</text><text x="957.5" y="439.5" text-anchor="middle" font-size="21">A7. 规范化</text><text x="560" y="352" text-anchor="middle" font-size="21"><tspan font-style="italic">e</tspan><tspan baseline-shift="sub" font-size="70%">u</tspan> ≥ <tspan font-style="italic">e</tspan><tspan baseline-shift="sub" font-size="70%">v</tspan> + p + 2</text></g></svg>