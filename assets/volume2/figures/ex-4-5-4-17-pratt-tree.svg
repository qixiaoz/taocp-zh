<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="380" viewBox="0 0 1220 380" role="img" aria-labelledby="title desc">
<title id="title">习题17的素性证书树</title>
<desc id="desc">根为(1009,11)，子结点依次为四个(2,1)、(7,3)、两个(3,2)。(7,3)有(2,1)和(3,2)两个子结点；每个(3,2)再有一个(2,1)子结点。共13个结点与12条无向显示的父子连线。</desc>
