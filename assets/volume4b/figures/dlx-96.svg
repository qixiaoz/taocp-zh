<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 150" width="450" height="150" role="img" aria-labelledby="t"><title id="t">式 (96) 的两种分支次序</title><path d="M177 8L42 35" stroke="#282828" fill="none" /><path d="M177 8L130 35" stroke="#282828" fill="none" /><path d="M177 8L306 35" stroke="#282828" fill="none" /><circle cx="177" cy="8" r="3" fill="#222" /><text text-anchor="middle" font-size="17" font-family="serif" fill="#171717" x="42" y="54">T₁ ⊕ T′</text><text text-anchor="middle" font-size="17" font-family="serif" fill="#171717" x="130" y="54">T₂ ⊕ T′</text><text text-anchor="middle" font-size="17" font-family="serif" fill="#171717" x="213" y="54">…</text><text text-anchor="middle" font-size="17" font-family="serif" fill="#171717" x="306" y="54">T𝑑 ⊕ T′</text><text text-anchor="middle" font-size="17" font-family="serif" fill="#171717" x="401" y="46">d ≤ d′</text><path d="M177 82L42 109" stroke="#282828" fill="none" /><path d="M177 82L130 109" stroke="#282828" fill="none" /><path d="M177 82L306 109" stroke="#282828" fill="none" /><circle cx="177" cy="82" r="3" fill="#222" /><text text-anchor="middle" font-size="17" font-family="serif" fill="#171717" x="42" y="128">T ⊕ T′₁</text><text text-anchor="middle" font-size="17" font-family="serif" fill="#171717" x="130" y="128">T ⊕ T′₂</text><text text-anchor="middle" font-size="17" font-family="serif" fill="#171717" x="213" y="128">…</text><text text-anchor="middle" font-size="17" font-family="serif" fill="#171717" x="306" y="128">T ⊕ T′𝑑′</text><text text-anchor="middle" font-size="17" font-family="serif" fill="#171717" x="401" y="120">d &gt; d′</text></svg>