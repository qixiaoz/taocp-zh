<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 510" role="img" aria-labelledby="title desc">
<title id="title">三角形ABC及三个反射邻居</title>
<desc id="desc">实线三角形ABC的三个邻居为CBA′、ACB′、BAC′。A处三个角均标90度，B处三个角均标36度，C处三个角均标45度；A′、B′、C′处分别标90、36、45度。</desc>
<rect width="420" height="510" fill="white"/>
<g fill="none" stroke="#222" stroke-width="1.6">
<path d="M60 335L200 180L350 335Q205 328 60 335"/>
<g stroke-dasharray="4 3"><path d="M200 180L60 80Q76 208 60 335"/><path d="M200 180L350 30Q363 185 350 335"/><path d="M60 335L200 470L350 335"/></g>
</g>
<g fill="#222"><circle cx="60" cy="335" r="2.5"/><circle cx="350" cy="335" r="2.5"/><circle cx="200" cy="180" r="2.5"/><circle cx="60" cy="80" r="2.5"/><circle cx="350" cy="30" r="2.5"/><circle cx="200" cy="470" r="2.5"/></g>
<g fill="#111" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="32"><text x="189" y="157">A</text><text x="24" y="348">B</text><text x="363" y="348">C</text><text x="208" y="492">A′</text><text x="363" y="40">B′</text><text x="15" y="88">C′</text></g>
<g fill="#111" font-family="Georgia, 'Times New Roman', serif" font-size="14" text-anchor="middle">
<text x="177" y="185">90</text><text x="225" y="185">90</text><text x="200" y="206">90</text>
<text x="79" y="299">36</text><text x="98" y="323">36</text><text x="96" y="353">36</text>
<text x="326" y="297">45</text><text x="314" y="323">45</text><text x="314" y="353">45</text>
<text x="200" y="453">90</text><text x="337" y="72">36</text><text x="84" y="111">45</text>
</g></svg>
