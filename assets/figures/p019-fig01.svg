<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 142" width="730" height="142" role="img" aria-labelledby="title desc"><title id="title">算法 E 的流程图</title><desc id="desc">E1 求余数，再到 E2。余数为零时向下退出，否则前往 E3 减少，返回 E1。</desc><defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="currentColor" stroke-width="1.2"/></marker></defs><g fill="white" stroke="#202020" stroke-width="1.5"><path d="M74 8V49 M667 49V22H74" fill="none" marker-end="url(#arr)"/><path d="M74 22V50 M139 75H291 M464 75H611 M378 99V134" marker-end="url(#arr)" fill="none"/><path d="M139 75H291" marker-end="url(#arr)"/><path d="M464 75H611" marker-end="url(#arr)"/><path d="M74 24V50" marker-end="url(#arr)"/><rect x="8" y="51" width="131" height="49"/><rect x="293" y="51" width="170" height="49" rx="24"/><rect x="612" y="51" width="109" height="49"/></g><g font-family="Songti SC, SimSun, serif" font-size="21" fill="#171717" text-anchor="middle"><text x="74" y="83">E1. 求余数</text><text x="378" y="83">E2. 余数为零?</text><text x="667" y="83">E3. 减少</text><text x="482" y="68">否</text><text x="397" y="123">是</text></g></svg>
