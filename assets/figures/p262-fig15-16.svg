<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" width="620" height="250" role="img" aria-labelledby="title desc">
  <title id="title">图 15　一棵树；图 16　另一棵树</title>
  <desc id="desc">根 A 在下方。左图中 A 的子结点从左至右为 B、C，C 的子结点为 D、E、F。右图中相应次序为 C、B 和 D、F、E。两图中 G 都是 F 的子结点。左图标出 0 至 3 层。</desc>
  <rect width="620" height="250" fill="white"/>
  <g font-family="'Songti SC', 'Noto Serif CJK SC', serif" fill="#181818" font-size="17">
    <g text-anchor="end">
      <text x="46" y="197">0 层</text>
      <text x="46" y="141">1 层</text>
      <text x="46" y="85">2 层</text>
      <text x="46" y="29">3 层</text>
    </g>
    <g id="fig15">
      <g stroke="#282828" stroke-width="1.25" fill="none">
        <path d="M150 191 L94 135 M150 191 L206 135 M206 135 L150 79 M206 135 L206 79 M206 135 L262 79 M262 79 L262 23"/>
      </g>
      <g fill="white" stroke="#282828" stroke-width="1.3">
        <circle cx="150" cy="191" r="13.5"/>
        <circle cx="94" cy="135" r="13.5"/>
        <circle cx="206" cy="135" r="13.5"/>
        <circle cx="150" cy="79" r="13.5"/>
        <circle cx="206" cy="79" r="13.5"/>
        <circle cx="262" cy="79" r="13.5"/>
        <circle cx="262" cy="23" r="13.5"/>
      </g>
      <g text-anchor="middle" font-family="'Times New Roman', serif" font-style="italic" font-size="18">
        <text x="150" y="197">A</text>
        <text x="94" y="141">B</text>
        <text x="206" y="141">C</text>
        <text x="150" y="85">D</text>
        <text x="206" y="85">E</text>
        <text x="262" y="85">F</text>
        <text x="262" y="29">G</text>
      </g>
      <text x="179" y="238" text-anchor="middle"><tspan font-weight="bold">图 15</tspan><tspan dx="12">一棵树</tspan></text>
    </g>
    <g id="fig16">
      <g stroke="#282828" stroke-width="1.25" fill="none">
        <path d="M502 191 L446 135 M502 191 L558 135 M446 135 L390 79 M446 135 L446 79 M446 135 L502 79 M446 79 L446 23"/>
      </g>
      <g fill="white" stroke="#282828" stroke-width="1.3">
        <circle cx="502" cy="191" r="13.5"/>
        <circle cx="558" cy="135" r="13.5"/>
        <circle cx="446" cy="135" r="13.5"/>
        <circle cx="390" cy="79" r="13.5"/>
        <circle cx="502" cy="79" r="13.5"/>
        <circle cx="446" cy="79" r="13.5"/>
        <circle cx="446" cy="23" r="13.5"/>
      </g>
      <g text-anchor="middle" font-family="'Times New Roman', serif" font-style="italic" font-size="18">
        <text x="502" y="197">A</text>
        <text x="558" y="141">B</text>
        <text x="446" y="141">C</text>
        <text x="390" y="85">D</text>
        <text x="502" y="85">E</text>
        <text x="446" y="85">F</text>
        <text x="446" y="29">G</text>
      </g>
      <text x="474" y="238" text-anchor="middle"><tspan font-weight="bold">图 16</tspan><tspan dx="12">另一棵树</tspan></text>
    </g>
